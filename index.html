<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Quizzy</title>
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
:root{--ink:#0b2530;--a:#ff6f59;--b:#ffc93c;--c:#7bdff2;--d:#b79cff}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;min-height:100vh;font-family:"Avenir Next Rounded","Nunito","Trebuchet MS",system-ui,sans-serif;background:linear-gradient(160deg,#06303a,#0c1c3d) fixed;color:#effcff}
main{max-width:900px;margin:0 auto;padding:16px}
h1,h2,h3,p{margin:.4em 0}
h1.logo{font-size:2.8rem;letter-spacing:-.04em;margin:.1em 0}
.card{background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.16);border-radius:16px;padding:12px;margin:10px 0}
button{font:inherit;font-weight:800;border:0;border-radius:12px;padding:10px 16px;cursor:pointer;background:var(--c);color:var(--ink);box-shadow:0 4px 0 rgba(0,0,0,.28);transition:transform .08s}
button:active{transform:translateY(3px);box-shadow:none}
button.g{background:var(--b)}button.r{background:var(--a)}
button.o{background:transparent;color:#effcff;box-shadow:inset 0 0 0 2px rgba(255,255,255,.35)}
button.s{padding:6px 10px;font-size:.85rem}
button:disabled{opacity:.4;cursor:default}
:focus-visible{outline:3px solid var(--b);outline-offset:2px}
input,select{font:inherit;padding:9px;border:0;border-radius:10px;width:100%;min-width:0;background:#fff;color:var(--ink)}
input[type=file]{width:auto;background:none;color:inherit;padding:0}
input[type=checkbox]{width:26px;height:26px;accent-color:var(--ink);flex:none}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row>input:not([type]){flex:1;min-width:120px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.c0{background:var(--a)}.c1{background:var(--b)}.c2{background:var(--c)}.c3{background:var(--d)}
.opt{min-height:84px;font-size:1.2rem;font-weight:800;border-radius:20px;color:var(--ink);display:flex;align-items:center;gap:12px;padding:12px;text-align:left;box-shadow:0 6px 0 rgba(0,0,0,.28);animation:pop .4s backwards}
.opt .l{display:grid;place-items:center;width:38px;height:38px;border-radius:50%;background:var(--ink);color:#fff;flex:none}
.opt.sel{outline:5px solid #fff;transform:scale(.96)}
.at{display:flex;align-items:center;gap:8px;padding:8px;border-radius:14px;color:var(--ink)}
.bar{height:10px;background:rgba(255,255,255,.15);border-radius:9px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--b);transform-origin:left;animation:drain linear forwards}
#tm{font-size:2.6rem;margin:0;min-width:2ch}
#tm.hot{color:var(--a);animation:beat .5s infinite alternate}
.badge{display:inline-block;background:var(--d);color:var(--ink);font-weight:800;border-radius:20px;padding:4px 14px}
.code{font-size:min(18vw,7rem);font-weight:900;letter-spacing:.08em;color:var(--b)}
.chip{display:inline-block;background:var(--c);color:var(--ink);border-radius:20px;padding:6px 14px;margin:4px;font-weight:800;animation:pop .3s}
.mid{text-align:center}
.good{color:#9dffb0}.bad{color:#ffa391}
#play{padding-top:4vh}
#mute{position:fixed;top:8px;right:8px;z-index:9;padding:6px 10px}
#host>*,#play>*{animation:rise .35s backwards}
@keyframes pop{from{transform:scale(.6);opacity:0}}
@keyframes rise{from{transform:translateY(14px);opacity:0}}
@keyframes drain{to{transform:scaleX(0)}}
@keyframes beat{to{transform:scale(1.25)}}
@keyframes bounce{0%{transform:scale(0)}60%{transform:scale(1.3)}}
@keyframes shake{25%{transform:translateX(-12px)}75%{transform:translateX(12px)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.c4{background:#8be0a4}.c5{background:#ff9ecb}.c6{background:#ffa94d}.c7{background:#cfd8e6}
input[type=number]{width:76px}
#mute,#mm{position:fixed;top:8px;z-index:9;padding:6px 10px}#mute{right:8px}#mm{right:62px}
.em{font-size:1.5rem;padding:4px 8px;background:transparent;box-shadow:none}.em.on{outline:3px solid var(--b)}
.pod{display:flex;justify-content:center;align-items:flex-end;gap:10px;margin:16px 0}
.pc{display:flex;flex-direction:column;align-items:center;flex:1;max-width:160px}
.pb{width:100%;border-radius:12px 12px 0 0;display:grid;place-items:center;font-size:2rem;font-weight:900;color:var(--ink);transform-origin:bottom}
@keyframes grow{from{transform:scaleY(0)}}
main{padding:52px 16px 76px}
#lg{position:fixed;top:8px;right:8px;z-index:9;padding:6px 10px}#mute{right:62px}#mm{right:116px}
#emo{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;gap:6px;padding:8px;background:rgba(6,20,40,.88);z-index:8}
#emo button{font-size:1.7rem}
.fl{position:fixed;bottom:70px;z-index:20;font-size:2.6rem;pointer-events:none;text-align:center;animation:fly 2.5s ease-out forwards}
.fl small{display:block;font-size:.8rem;font-weight:800}
@keyframes fly{to{transform:translateY(-60vh);opacity:0}}
.qrb{display:flex;flex-direction:column;align-items:center;gap:4px;cursor:zoom-in}
.qrb svg{width:168px;height:168px;border-radius:12px;display:block}
.qrb .qc{display:none;font-size:2.4rem;font-weight:900;color:var(--b)}
.qrb.big{position:fixed;inset:0;z-index:30;justify-content:center;background:rgba(6,20,40,.96);cursor:zoom-out}
.qrb.big svg{width:min(88vw,70vh);height:min(88vw,70vh)}
.qrb.big .qc{display:block}
#lg svg{display:block;height:16px;width:auto;border-radius:2px}
#ver{position:fixed;bottom:3px;right:6px;z-index:9;font-size:10px;opacity:.45;pointer-events:none}
#bigj{position:fixed;inset:0;z-index:40;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3vh;background:#06141f;cursor:zoom-out;text-align:center}
#bigj .code{font-size:min(20vw,16vh);line-height:1}
#bigj svg{width:min(88vw,52vh);height:min(88vw,52vh);border-radius:12px}
#bigj .bx{position:fixed;bottom:18px;left:0;right:0;opacity:.6}
@media(orientation:landscape){#bigj{flex-direction:row;gap:6vw}#bigj .code{font-size:min(14vw,28vh)}#bigj svg{width:min(70vh,40vw);height:min(70vh,40vw)}}
</style>
</head>
<body>
<button id="mm" class="o s" onclick="togMm()" title="Music on/off" aria-label="Music on/off"></button>
<button id="mute" class="o s" onclick="mute=!mute;LS.setItem('qz_mute',mute?1:0);this.textContent=mute?'🔇':'🔊'" title="Sound effects on/off" aria-label="Sound effects on/off"></button>
<button id="lg" class="o s" onclick="togLang()" title="Language" aria-label="Language"></button>
<div id="emo" hidden></div>
<div id="ver" translate="no">v1.1</div>
<main>
<section id="menu" class="mid">
  <h1 class="logo">Quizzy</h1>
  <p>Play quizzes with friends, hosted from your own device</p>
  <div class="grid" style="max-width:560px;margin:28px auto">
    <button class="opt c1" style="justify-content:center;min-height:120px" onclick="show('join')"><span style="font-size:2rem">🎮</span><span>Join a game</span></button>
    <button class="opt c2" style="justify-content:center;min-height:120px" onclick="home()"><span style="font-size:2rem">✏️</span><span>Create quiz</span></button>
  </div>
</section>

<section id="join" hidden>
  <button class="o" onclick="menu()">← Back</button>
  <div class="card" id="jcard">
    <h2>Join a game</h2>
    <div class="row"><input id="code" placeholder="Game code" inputmode="numeric"><input id="nick" placeholder="Nickname" maxlength="16"></div>
    <p><small>Pick your character</small></p>
    <div id="ems" class="row" style="margin-bottom:8px"></div>
    <button class="g" onclick="join()">Join</button> <small id="jmsg"></small>
  </div>
  <div id="ended" class="card mid" hidden><div style="font-size:3.5rem">🚪</div><h2 id="emsg"></h2><button class="g" onclick="menu()">Back to menu</button></div>
</section>

<section id="quizzes" hidden>
  <div class="row">
    <button class="o" onclick="menu()">← Back</button>
    <h2 style="flex:1">My quizzes</h2>
    <input id="find" placeholder="Search…" oninput="home()" style="width:140px;flex:none">
    <button class="g" onclick="edit()">+ New quiz</button>
    <button onclick="$('#imp').click()">Import</button>
    <input id="imp" type="file" accept=".json,application/json" hidden onchange="imp(this.files[0]);this.value=''">
  </div>
  <div id="lib"></div>
</section>

<section id="edit" hidden>
  <div class="row">
    <input id="t" placeholder="Quiz title" oninput="cur.title=this.value">
    <button class="g" onclick="saveQ()">Save</button>
    <button class="o" onclick="home()">Cancel</button>
  </div>
  <p><small>Tick every correct answer. With 2 or more ticked, choose whether any one of them is right or all must be selected. Press Ctrl+V to paste an image into the selected question.</small></p>
  <div id="qs"></div>
  <button onclick="addQ()">+ Add question</button>
</section>

<section id="host" class="mid" hidden></section>
<section id="play" class="mid" hidden></section>
</main>

<script>
const LS=(()=>{try{const t=window.localStorage;t.getItem("q");return t}catch(e){const m={};return{getItem:k=>k in m?m[k]:null,setItem:(k,v)=>{m[k]=String(v)},removeItem:k=>{delete m[k]}}}})();
const $=s=>document.querySelector(s),
esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"})[c]),
LT="ABCDEFGH",KEY="quizzy_games",
load=()=>{try{const g=JSON.parse(LS.getItem(KEY))||[];g.forEach(x=>x.qs.forEach(q=>{if(!Array.isArray(q.ok))q.ok=[q.ok|0];q.mode=q.mode||(q.ok.length>1?"all":"any")}));return g}catch(e){return[]}},
save=g=>{try{LS.setItem(KEY,JSON.stringify(g));return 1}catch(e){alert("Browser storage is full. Use fewer or smaller images.")}},
show=v=>{["menu","join","quizzes","edit","host","play"].forEach(x=>$("#"+x).hidden=x!=v);$("#emo").hidden=1},
blank=()=>({q:"",img:"",type:"choice",a:["","","",""],ok:[0],txt:"",tol:1,cs:0,mode:"any",time:20}),
live=()=>Object.values(players).filter(p=>p.c.open),
bc=m=>live().forEach(p=>p.c.send(m)),
rank=()=>Object.values(players).sort((a,b)=>b.score-a.score),
board=(n,f=0)=>rows(lb(n),f)||"<p>No players</p>",
pscr=h=>{show("play");$("#play").innerHTML=h;$("#emo").hidden=!(emoOn&&!over&&pc&&pc.open)};
let cur,peer,H,pc,over,fq,tk,pick=[],multi,AC,players={},mute=LS.getItem("qz_mute")=="1";
$("#mute").textContent=mute?"🔇":"🔊";
const EM=["🐱","🐶","🦊","🐼","🐸","🦄","🐙","🐵","🦁","🐯","🐧","🐳","🐲","🤖","👻","🚀"],
norm=(s,cs)=>{s=String(s).trim().replace(/\s+/g," ");return cs?s:s.toLowerCase()},
acc=q=>(q.txt||"").split(",").map(x=>norm(x,q.cs)).filter(Boolean),
lev=(a,b)=>{let p=[...Array(b.length+1).keys()];for(let i=1;i<=a.length;i++){const c=[i];for(let j=1;j<=b.length;j++)c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]==b[j-1]?0:1));p=c}return p[b.length]};
let mm=LS.getItem("qz_mm")=="1",em=LS.getItem("qz_em")||EM[0],mw=0,mi,bt=0;
let mst=LS.getItem("qz_mus")||"upbeat",X,NB,qt=0;
const mmUi=()=>{$("#mm").textContent=mm?"🎵 ✕":"🎵"},
togMm=()=>{mm=!mm;LS.setItem("qz_mm",mm?1:0);mmUi();music(mw)},
hz=n=>440*2**((n-69)/12),rnd=n=>Math.floor(Math.random()*n),pk=a=>a[rnd(a.length)],
CT={M:[0,4,7],m:[0,3,7],M7:[0,4,7,11],m7:[0,3,7,10],"7":[0,4,7,10]},ARR=[1,2,3,3,2,3,3,1],
MO=[["upbeat","Upbeat"],["chill","Chill"],["arcade","Arcade"],["off","No music"]],
musSel=()=>`<select style="width:auto" title="Music" onchange="setMus(this.value)">${MO.map(([v,l])=>`<option value="${v}" ${v==mst?"selected":""}>${l}</option>`).join("")}</select>`,
MS={
upbeat:{bpm:122,rt:48,lo:24,sc:[0,2,4,7,9],sw:0,wet:.18,ln:[1,1,1,2,2,3,4],rp:.2,cm:"stab",lt:"triangle",bt:"triangle",bv:.5,cv:.14,ev:.45,
 pr:[[[0,"M"],[7,"M"],[9,"m"],[5,"M"]],[[0,"M"],[9,"m"],[5,"M"],[7,"M"]],[[5,"M"],[7,"M"],[4,"m"],[9,"m"]],[[0,"M"],[5,"M"],[7,"M"],[5,"M"]]],
 k:["x...x...x...x...","x...x...x..xx..."],s:["....x.......x..."],h:["..x...x...x...x.","x.x.x.x.x.x.x.x."],
 b:["r.......r...f...","r..r..r.r..r..f.","r.r.r.r.r.r.r.r."],c:["..x...x...x...x.","x.....x...x....."]},
chill:{bpm:80,rt:48,lo:12,sc:[0,2,4,7,9],sw:.5,wet:.2,dry:1,ln:[2,2,3,4,4,6],rp:.4,cm:"ep",lt:"sine",bt:"sine",bv:.55,cv:.13,ev:.4,
 pr:[[[0,"M7"],[9,"m7"],[2,"m7"],[7,"7"]],[[5,"M7"],[4,"m7"],[2,"m7"],[0,"M7"]],[[9,"m7"],[2,"m7"],[7,"7"],[0,"M7"]],[[0,"M7"],[5,"M7"],[4,"m7"],[9,"m7"]]],
 k:["x.....x...x.....","x.......x.x....."],s:["....x.......x..."],h:["x.x.x.x.x.x.x.x.","..x...x...x...x."],
 b:["r.......r.....f.","r.....r.r......."],c:["x.....x...x.....","x.......x.....x."]},
arcade:{bpm:140,rt:45,lo:24,sc:[0,3,5,7,10],sw:0,wet:.12,ln:[1,1,1,1,2,2,3],rp:.1,cm:"arp",lt:"square",bt:"square",bv:.28,cv:.09,ev:.2,
 pr:[[[0,"m"],[8,"M"],[3,"M"],[10,"M"]],[[0,"m"],[10,"M"],[8,"M"],[10,"M"]],[[5,"m"],[0,"m"],[8,"M"],[7,"m"]],[[0,"m"],[7,"m"],[8,"M"],[10,"M"]]],
 k:["x...x...x...x...","x..xx...x..xx..."],s:["....x.......x...","....x...x...x..x"],h:["x.x.x.x.x.x.x.x.","xxxxxxxxxxxxxxxx"],
 b:["r.r.r.r.r.r.r.r.","r.rrr.r.r.rrr.r.","r.o.r.o.r.o.r.o."],c:["xxxxxxxxxxxxxxxx"]}};
mmUi();
function vo(o,t,f,d,v,ty,lp){
  const s=AC.createOscillator(),g=AC.createGain();s.type=ty;s.frequency.value=f;
  g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(v,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+d);
  if(lp){const q=AC.createBiquadFilter();q.type="lowpass";q.frequency.value=lp;s.connect(q);q.connect(g)}else s.connect(g);
  g.connect(o);s.start(t);s.stop(t+d+.05);
}
function dr(o,k,t,v){
  if(k=="k"){const s=AC.createOscillator(),g=AC.createGain();s.frequency.setValueAtTime(150,t);s.frequency.exponentialRampToValueAtTime(45,t+.12);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+.22);s.connect(g);g.connect(o);s.start(t);s.stop(t+.25);return}
  if(!NB||NB.sampleRate!=AC.sampleRate){NB=AC.createBuffer(1,AC.sampleRate,AC.sampleRate);NB.getChannelData(0).forEach((_,i,a)=>a[i]=Math.random()*2-1)}
  const s=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain(),h=k=="h";
  s.buffer=NB;f.type=h?"highpass":"bandpass";f.frequency.value=h?7500:1800;
  g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+(h?.04:.16));
  s.connect(f);f.connect(g);g.connect(o);s.start(t);s.stop(t+.2);
}
/* random 2-bar melody on a pentatonic scale; slots are eighth notes */
function mel(S,end){
  const n=Array(16).fill(0);let i=3+rnd(3),s=0;
  while(s<16){const l=Math.min(pk(S.ln),16-s);if(s%4==0||Math.random()>S.rp)n[s]={i,l};s+=l;i=Math.max(0,Math.min(9,i+pk([-2,-1,-1,0,1,1,2])))}
  let q=16;while(!n[--q]);
  n[q].i=end?(n[q].i>=3?5:0):pk([2,3,7,8]);
  return n;
}
const mut=a=>{a=a.map(x=>x&&{...x});for(let k=0;k<3;k++){const x=a[rnd(16)];if(x)x.i=Math.max(0,Math.min(9,x.i+pk([-2,-1,1,2])))}return a};
/* one 16th-note step. Every 4 bars: new chord progression and drum/bass patterns; every 8 sections: new melody; layers come and go (ARR) */
function mstep(){
  const S=X.S,s=X.st%16,sp=60/S.bpm/4,t=X.t+(s%4==2?S.sw*sp:0),o=X.bus,dy=S.dry?X.dry:X.bus;
  if(!s){
    const bi=X.B++%4;
    if(!bi){
      const c=X.sec++%8;
      if(!c){X.A=mel(S,0);X.Z=mel(S,1)}
      X.lv=ARR[c];X.mu=[c%2?mut(X.A):X.A,c%2?mut(X.Z):X.Z];
      let p;do p=pk(S.pr);while(p==X.pr&&S.pr.length>1);X.pr=p;
      X.k=pk(S.k);X.h=pk(S.h);X.bp=pk(S.b);X.cp=pk(S.c);X.sn=pk(S.s);
    }
    X.bi=bi;X.ch=X.pr[bi];
  }
  const [r0,ty]=X.ch,rt=r0>=6?r0-12:r0,iv=CT[ty],bi=X.bi,lv=X.lv,base=S.rt+12+rt;
  if(lv>=2){
    if(X.k[s]=="x")dr(dy,"k",t,.9);
    if(X.sn[s]=="x")dr(dy,"s",t,.4);
    if(X.h[s]=="x")dr(dy,"h",t,s%4==2?.16:.1);
    if(bi==3&&s>=12&&S.cm!="ep")dr(dy,"s",t,.12+.05*(s-12));
  }
  const bn=X.bp[s];
  if(bn!=".")vo(dy,t,hz(S.rt+rt+(bn=="f"?7:bn=="o"?12:0)),sp*3,S.bv,S.bt);
  if(S.cm=="arp")vo(o,t,hz(base+12+iv[[0,1,2,1][s%4]%iv.length]),sp*1.6,S.cv,"square");
  else if(X.cp[s]=="x")iv.forEach(x=>S.cm=="ep"?(vo(o,t,hz(base+x),1.4,S.cv,"sine"),vo(o,t,hz(base+x+12),.5,S.cv*.3,"sine")):vo(o,t,hz(base+x),.2,S.cv,"sawtooth",1300));
  if(lv>=3&&s%2==0){
    const x=X.mu[bi>>1][(bi&1)*8+s/2];
    if(x){
      const pcs=iv.map(a=>(S.rt+rt+a)%12),md=j=>S.rt+S.lo+12*Math.floor(j/5)+S.sc[j%5];
      let i=x.i;
      if(s%8==0)i=[i,i+1,i-1].find(j=>j>=0&&j<10&&pcs.includes(md(j)%12))??i;
      vo(o,t,hz(md(i)),x.l*sp*2*.95,S.ev,S.lt);
    }
  }
  X.st++;X.t+=sp;
}
function mtick(){
  if(!X)return;
  if(AC.state=="suspended")AC.resume();
  if(X.t<AC.currentTime-.5)X.t=AC.currentTime+.05;
  while(X.t<AC.currentTime+.6)mstep();
}
function music(on){
  mw=on;clearInterval(mi);mi=0;
  if(X){const x=X;X=0;x.out.gain.cancelScheduledValues(0);x.out.gain.setTargetAtTime(0,AC.currentTime,.08);setTimeout(()=>x.out.disconnect(),700)}
  if(!on||mm||qt||!MS[mst])return;
  try{
    AC=AC||new AudioContext();AC.resume();
    const S=MS[mst],out=AC.createGain(),bus=AC.createGain(),dry=AC.createGain(),dl=AC.createDelay(1),fb=AC.createGain(),wt=AC.createGain(),n=AC.currentTime;
    out.gain.setValueAtTime(0,n);out.gain.linearRampToValueAtTime(.2,n+.5);
    dl.delayTime.value=60/S.bpm*.75;fb.gain.value=.3;wt.gain.value=S.wet;
    bus.connect(out);dry.connect(out);bus.connect(dl);dl.connect(fb);fb.connect(dl);dl.connect(wt);wt.connect(out);out.connect(AC.destination);
    X={S,out,bus,dry,t:n+.1,st:0,B:0,sec:2,pr:0,A:mel(S,0),Z:mel(S,1)};
    mi=setInterval(mtick,100);
  }catch(e){X=0}
}
function setMus(v){mst=v;H.cfg.mus=v;LS.setItem("qz_mus",v);bc({t:"mus",v});music(mw)}
function emUi(){$("#ems").innerHTML=EM.map(e=>`<button class="em ${e==em?"on":""}" onclick="em='${e}';LS.setItem('qz_em',em);emUi()">${e}</button>`).join("")}
emUi();

/* ---------- sound ---------- */
const NOTES={tick:[[880,.05]],click:[[600,.04]],pop:[[520,.06],[780,.08]],join:[[660,.08],[880,.12]],go:[[392,.1],[523,.1],[659,.1],[784,.25]],ok:[[523,.1],[659,.1],[784,.25]],no:[[260,.15],[196,.3]],end:[[523,.15],[659,.15],[784,.15],[1047,.4]]};
function sfx(k){
  if(mute||qt)return;
  try{
    AC=AC||new AudioContext();AC.resume();
    let t=AC.currentTime;
    NOTES[k].forEach(([f,d])=>{
      const o=AC.createOscillator(),g=AC.createGain();
      o.type=k=="no"?"sawtooth":"triangle";o.frequency.value=f;
      g.gain.setValueAtTime(.15,t);g.gain.exponentialRampToValueAtTime(.001,t+d);
      o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d);t+=d*.9;
    });
  }catch(e){}
}
addEventListener("pointerdown",e=>{try{AC=AC||new AudioContext();AC.resume()}catch(x){}if(e.target.closest("button")&&e.target.id!="mute")sfx("click")});

/* shared countdown: updates #tm, ticks (host only), calls end at 0 */
function clock(t,end,snd){
  clearInterval(tk);
  const t0=Date.now();let last=t;
  tk=setInterval(()=>{
    const l=Math.max(0,Math.ceil(t-(Date.now()-t0)/1000)),e=$("#tm");
    if(e){e.textContent=l;e.classList.toggle("hot",l<=5)}
    if(l!=last){last=l;if(snd&&l<=5&&l>0)sfx("tick")}
    if(!l){clearInterval(tk);end&&end()}
  },200);
}

/* ---------- export / import / share ---------- */
function exp(id){
  const g=load().find(x=>x.id==id),a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob([JSON.stringify({quizzy:1,...g})],{type:"application/json"}));
  a.download=(g.title.replace(/[^\w-]+/g,"_")||"quiz")+".quizzy.json";
  a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}
function clean(o){
  if(!o||!Array.isArray(o.qs)||!o.qs.length)throw 0;
  return{id:""+Date.now()+Math.floor(Math.random()*1e3),title:String(o.title||"Imported quiz").slice(0,80),
    qs:o.qs.slice(0,100).map(q=>{
      const a=(Array.isArray(q.a)?q.a:[]).slice(0,8).map(x=>String(x||"").slice(0,100));
      while(a.length<2)a.push("");
      const ok=(x=>x.length?x:[0])([...new Set((Array.isArray(q.ok)?q.ok:[q.ok]).map(Number).filter(x=>x>=0&&x<a.length))]);
      return{q:String(q.q||"").slice(0,200),img:/^data:image\//.test(q.img)?q.img:"",type:q.type=="text"?"text":"choice",a,ok,
        mode:q.mode=="any"||(q.mode!="all"&&ok.length<2)?"any":"all",cs:!!q.cs,
        txt:String(q.txt||"").slice(0,200),tol:Math.min(9,Math.max(0,Math.round(+q.tol)||0)),
        time:Math.min(300,Math.max(5,Math.round(+q.time)||20))}})};
}
function add(o){
  try{
    const q=clean(o);
    if(confirm("Add the quiz “"+q.title+"” ("+q.qs.length+" questions)?")){const g=load();g.push(q);if(save(g))home()}
  }catch(e){alert("That is not a valid Quizzy quiz.")}
}
function imp(f){if(f)f.text().then(t=>add(JSON.parse(t))).catch(()=>alert("That is not a valid Quizzy quiz."))}
function share(id){
  const g=load().find(x=>x.id==id),o={title:g.title,qs:g.qs.map(q=>({...q,img:""}))},
  u=location.href.split(/[?#]/)[0]+"#import="+btoa(unescape(encodeURIComponent(JSON.stringify(o))));
  (navigator.clipboard?navigator.clipboard.writeText(u):Promise.reject()).then(
    ()=>alert("Link copied. It carries the questions and answers. To include images, send an exported file instead."),
    ()=>prompt("Copy this link:",u));
}

  fq=undefined;show("edit");ed();
}
const ind=q=>q.type=="text"?"✎ Typed answer":q.ok.length<2?"◉ One right answer":q.mode=="all"?"☑ All ticked must be selected":"◉ Any ticked answer is right";
function ed(){
  $("#t").value=cur.title;
  $("#qs").innerHTML=cur.qs.map((q,i)=>`<div class="card" onpointerdown="fq=${i}" onfocusin="fq=${i}">
    <div class="row"><button class="o s" onclick="cur.qs[${i}].c=!cur.qs[${i}].c;ed()" aria-label="Collapse or expand">${q.c?"▸":"▾"}</button><b>${i+1}</b>

      ${q.c?`<small>${ind(q)} · ${q.time}s</small>`:""}</div>
    ${q.c?"":`<div class="row" style="margin:8px 0">
      <select style="width:auto" onchange="cur.qs[${i}].type=this.value;ed()"><option value="choice">Pick an answer</option><option value="text" ${q.type=="text"?"selected":""}>Type the answer</option></select>
      <span class="badge" id="mb${i}">${ind(q)}</span>${q.type!="text"&&q.ok.length>1?`<select style="width:auto" onchange="cur.qs[${i}].mode=this.value;ed()"><option value="any">Any ticked is right</option><option value="all" ${q.mode=="all"?"selected":""}>All ticked required</option></select>`:""}
      <label class="row" style="gap:4px"><input type="number" min="5" max="300" value="${q.time}" oninput="cur.qs[${i}].time=+this.value"> sec</label>
      <button class="r s" style="margin-left:auto" onclick="cur.qs.splice(${i},1);ed()">Delete</button></div>
    <div class="row" style="margin-bottom:8px">
      ${q.img?`<img src="${esc(q.img)}" alt="" style="height:70px;border-radius:8px"><button class="o s" onclick="cur.qs[${i}].img='';ed()">Remove image</button>`:""}
      <input type="file" accept="image/*" onchange="pic(${i},this.files[0])"><small>or paste with Ctrl+V</small></div>
    ${q.type=="text"?`<label>Accepted answers, separated by commas<input value="${esc(q.txt)}" oninput="cur.qs[${i}].txt=this.value"></label>
      <label class="row" style="margin-top:8px"><input type="checkbox" ${q.cs?"checked":""} onchange="cur.qs[${i}].cs=this.checked"> Case sensitive</label>
      <label class="row" style="margin-top:8px">Allowed typos <input type="number" min="0" max="9" value="${q.tol??1}" oninput="cur.qs[${i}].tol=+this.value"> letters wrong, missing or extra</label>`
    :`<div class="grid">${q.a.map((a,j)=>`<label class="at c${j}">
      <input type="checkbox" title="Correct answer" ${q.ok.includes(j)?"checked":""} onchange="tog(${i},${j},this.checked)">
      <input placeholder="Answer ${LT[j]}" value="${esc(a)}" oninput="cur.qs[${i}].a[${j}]=this.value">
      ${q.a.length>2?`<button class="s" style="background:var(--ink);color:#fff" onclick="rmA(${i},${j})" aria-label="Remove answer">✕</button>`:""}</label>`).join("")}</div>
      ${q.a.length<8?`<p><button class="o s" onclick="cur.qs[${i}].a.push('');ed()">+ Add answer</button></p>`:""}`}`}
  </div>`).join("");
}
function rmA(i,j){
  const q=cur.qs[i];
  q.a.splice(j,1);q.ok=q.ok.filter(x=>x!=j).map(x=>x>j?x-1:x);
  if(!q.ok.length)q.ok=[0];
  ed();
}
function tog(i,j,on){
  const q=cur.qs[i];
  q.ok=on?[...new Set([...q.ok,j])]:q.ok.filter(x=>x!=j);
  ed();
}
function addQ(){cur.qs.push(blank());ed();scrollTo(0,document.body.scrollHeight)}
function pic(i,f){
  if(!f||!cur.qs[i])return;
  const r=new FileReader();
  r.onload=()=>{const im=new Image();
    im.onload=()=>{const s=Math.min(1,480/im.width),c=document.createElement("canvas");
      c.width=im.width*s;c.height=im.height*s;c.getContext("2d").drawImage(im,0,0,c.width,c.height);
      cur.qs[i].img=c.toDataURL("image/jpeg",.7);ed()};
    im.src=r.result};
  r.readAsDataURL(f);
}
addEventListener("paste",e=>{
  if($("#edit").hidden)return;
  const it=[...e.clipboardData.items].find(x=>x.type.startsWith("image/"));
  if(it){e.preventDefault();pic(fq??cur.qs.length-1,it.getAsFile())}
});
function saveQ(){
  if(!cur.title.trim())return alert("Give your quiz a title.");
  if(!cur.qs.length)return alert("Add at least one question.");
  for(const [i,q] of cur.qs.entries()){
    q.time=Math.min(300,Math.max(5,Math.round(q.time)||20));
    q.tol=Math.min(9,Math.max(0,Math.round(q.tol??1)||0));
    const text=q.type=="text",
    bad=!q.q.trim()||(text?!acc(q).length:q.a.filter(x=>x.trim()).length<2||!q.ok.length||q.ok.some(j=>!q.a[j].trim()));
    if(bad)return alert("Question "+(i+1)+" is incomplete. Add the question text and "+(text?"at least one accepted answer.":"at least 2 answers, with every ticked answer filled in."));
  }
  cur.qs.forEach(q=>delete q.c);
  const g=load(),k=g.findIndex(x=>x.id==cur.id);
  k<0?g.push(cur):g[k]=cur;
  if(save(g))home();
}

/* ---------- host (runs on this device) ---------- */
function hostGame(id){
  H={g:load().find(x=>x.id==id),i:-1,cfg:{shuf:0,speed:1,lb:1,time:0,streak:0,pen:0,lim:0,auto:0,emo:1,max:0,po:0,mus:LS.getItem("qz_mus")||"upbeat"}};mst=H.cfg.mus;
  players={};mk(0);
}
function mk(n){
  const code=""+(100000+Math.floor(Math.random()*900000));
  H.code=code;peer=new Peer("kqz-"+code);
  peer.on("open",lobby);
  peer.on("error",e=>{
    if(e.type=="unavailable-id"&&n<5){peer.destroy();mk(n+1)}
    else{alert("Could not start hosting ("+e.type+"). Check your internet connection.");endHost()}
  });
  peer.on("connection",c=>{
    c.on("data",m=>onMsg(c,m));
    c.on("close",()=>{if(players[c.peer]&&H.st=="lobby")delete players[c.peer];lobbyUpd()});
  });
}
function lobby(){
  H.st="lobby";show("host");music(1);
  const u=H.u=location.href.split(/[?#]/)[0]+"?code="+H.code,c=H.cfg,
  ck=(k,t)=>`<label class="row"><input type="checkbox" ${c[k]?"checked":""} onchange="H.cfg.${k}=+this.checked"> ${t}</label>`,
  sel=(k,t,o)=>`<label class="row">${t} <select style="width:auto" onchange="H.cfg.${k}=+this.value">${o.map(([v,l])=>`<option value="${v}" ${c[k]==v?"selected":""}>${l}</option>`).join("")}</select></label>`;
  $("#host").innerHTML=`<h2>${esc(H.g.title)}</h2><div class="row" style="justify-content:center;gap:24px"><div><p>Join with this code</p><div class="code">${H.code}</div></div>${qrBox(u,H.code)}</div>
  <p><small>${esc(u)}</small> <button class="s" onclick="copyLink(this)">Copy link</button> <button class="s" onclick="bigJoin()">🔍 Maximize code and QR</button></p>
  <div id="pl"></div>
  <div class="card" style="text-align:left"><b>Game settings</b>
    ${ck("shuf","Shuffle question order")}${ck("speed","Faster answers earn more points")}${ck("streak","Streak bonus for answering correctly in a row")}
    ${ck("pen","Lose points for wrong answers")}${ck("lb","Show leaderboard after each question")}${ck("auto","Go to the next question automatically")}${ck("emo","Allow player reactions")}
    ${sel("time","Time per question",[[0,"As set in the quiz"],...[10,20,30,60].map(t=>[t,t+" seconds for all"])])}
    ${sel("lim","Number of questions",[[0,"All"],5,10,20].map(t=>t.length?t:[t,t]))}
    ${sel("max","Player limit",[[0,"No limit"],...[5,10,25,50].map(t=>[t,t])])}
    <label class="row">Music ${musSel()}</label>
    ${ck("po","Players also hear music and sounds on their own devices")}
  </div>
  <div class="row" style="justify-content:center"><button class="g" id="go" onclick="nextQ()">Start game</button><button class="o" onclick="endHost()">Cancel</button></div>
  <p><small>Keep this tab open while people play.</small></p>`;
  lobbyUpd();
}
function lobbyUpd(){
  const l=$("#pl");if(!l||H.st!="lobby")return;
  const a=live();
  l.innerHTML=a.map(p=>`<span class="chip">${p.e} ${esc(p.name)}</span>`).join("")||"<p>Waiting for players…</p>";
  $("#go").disabled=!a.length;
}
function onMsg(c,m){
  if(m.t=="probe")return c.send({t:"st",ok:H.st=="lobby"&&!(H.cfg.max&&Object.keys(players).length>=H.cfg.max),why:H.st=="lobby"?"This game is full.":H.st=="end"?"This game has ended.":"That game has already started."});
  if(m.t=="emo"){if(H.cfg.emo&&players[c.peer]&&REA.includes(m.e))fly(m.e,players[c.peer].name);return}
  if(m.t=="join"){
    if(H.st!="lobby")return c.send({t:"no",why:"That game has already started."});
    if(H.cfg.max&&Object.keys(players).length>=H.cfg.max)return c.send({t:"no",why:"This game is full."});
    let n=(m.name+"").slice(0,16),b=n,k=2;
    while(Object.values(players).some(p=>p.name==n))n=b+" "+k++;
    players[c.peer]={name:n,e:EM.includes(m.e)?m.e:EM[0],score:0,c,ans:null};
    c.send({t:"in",name:n,mus:H.cfg.mus,po:H.cfg.po});sfx("join");lobbyUpd();
  }else if(m.t=="ans"){
    const q=H.g.qs[H.i]||{},p=players[c.peer],a=q.type=="text"?(typeof m.a=="string"?m.a.trim().slice(0,40):""):Array.isArray(m.a)?[...new Set(m.a.filter(x=>Number.isInteger(x)&&x>=0&&x<(q.a||[]).length))]:[];
    if(H.st=="q"&&p&&p.ans==null&&a.length){
      p.ans=a;p.ms=Date.now()-H.t0;cnt();
      if(live().every(p=>p.ans!=null))reveal();
    }
  }
}
function nextQ(){
  clearTimeout(H.at);
  if(H.i<0){
    if(H.cfg.shuf)H.g.qs.sort(()=>Math.random()-.5);
    if(H.cfg.lim)H.g.qs=H.g.qs.slice(0,H.cfg.lim);
    bc({t:"cfg",emo:H.cfg.emo,po:H.cfg.po});
  }
  H.i++;H.i>=H.g.qs.length?fin():ask();
}
function opts(q,c){
  return q.a.map((t,j)=>t.trim()?`<div class="opt c${j}" style="animation-delay:${j*.07}s;${c&&!q.ok.includes(j)?"opacity:.35":""}"><span class="l">${LT[j]}</span><span>${c&&q.ok.includes(j)?"✓ ":""}${esc(t)}</span>${c?`<b style="margin-left:auto">${c[j]}</b>`:""}</div>`:"").join("");
}
function cnt(){
  const e=$("#cnt");
  if(e&&H.st=="q")e.textContent=live().filter(p=>p.ans!=null).length+" / "+live().length+" answered";
}
function ask(){
  H.st="q";
  const q=H.g.qs[H.i],n=H.g.qs.length,t=H.cfg.time||q.time,mu=q.ok.length>1&&q.mode=="all";
  H.t=t;Object.values(players).forEach(p=>p.ans=null);H.t0=Date.now();
  bc({t:"q",i:H.i,n,q:q.q,a:q.a,time:t,multi:mu,type:q.type,img:q.img});sfx("go");
  $("#host").innerHTML=`<div class="bar"><i style="animation-duration:${t}s"></i></div>
  <p>Question ${H.i+1} of ${n} ${q.type=="text"?'<span class="badge">type the answer</span>':mu?'<span class="badge">select all that apply</span>':""}</p><h2>${esc(q.q)}</h2>
  ${q.img?`<img src="${esc(q.img)}" alt="" style="max-width:100%;max-height:34vh;border-radius:14px">`:""}
  <div class="row" style="justify-content:space-between"><h1 id="tm">${t}</h1><span id="cnt"></span><span class="row">${musSel()}<button class="o" onclick="reveal()">Skip</button></span></div>
  ${q.type=="text"?"<h3>Type your answer on your device</h3>":`<div class="grid">${opts(q)}</div>`}`;
  clock(t,reveal,1);cnt();
}
function reveal(){
  if(H.st!="q")return;
  H.st="r";clearInterval(tk);sfx("pop");
  const q=H.g.qs[H.i],tx=q.type=="text",ac=acc(q),c=q.a.map(()=>0),cf=H.cfg;
  Object.values(players).forEach(p=>{
    if(tx){const v=p.ans?norm(p.ans,q.cs):"";p.ok=!!v&&ac.some(x=>lev(x,v)<=Math.min(q.tol??1,Math.max(0,x.length-1)))}
    else{const s=p.ans||[];p.ok=q.mode=="all"?s.length==q.ok.length&&q.ok.every(x=>s.includes(x)):s.some(x=>q.ok.includes(x));s.forEach(x=>c[x]++)}
    p.d=0;
    if(p.ok){p.st=(p.st||0)+1;p.d=(cf.speed?Math.max(100,Math.round(1000*(1-p.ms/1000/H.t/2))):1000)+(cf.streak?Math.min(p.st-1,5)*100:0)}
    else{p.st=0;if(cf.pen&&p.ans!=null)p.d=-Math.min(p.score,300)}
    p.score+=p.d;
  });
  const r=rank(),L=cf.lb?lb(5):0,hit=r.filter(p=>p.ok).length;
  r.forEach((p,i)=>p.c.open&&p.c.send({t:"r",ok:p.ok,got:p.ans!=null,d:p.d,s:p.score,r:i+1,n:r.length,ca:tx?q.txt:"",lb:L}));
  $("#host").innerHTML=`<h2>${esc(q.q)}</h2>
  ${tx?`<div class="card"><p>Accepted answers</p><h1>${esc(q.txt)}</h1><p>${hit} of ${r.length} got it right</p></div>`:`<div class="grid">${opts(q,c)}</div>`}
  ${L?"<h2>Leaderboard</h2>"+board(5):""}
  <p class="row" style="justify-content:center"><button class="g" onclick="nextQ()">${H.i+1<H.g.qs.length?"Next question":"Finish"}</button>${musSel()}</p>`;
  if(cf.auto)H.at=setTimeout(()=>{if(H.st=="r")nextQ()},6000);
}
function fin(){
  H.st="end";sfx("end");music(0);
  const r=rank(),top=lb(3);
  r.forEach((p,i)=>p.c.open&&p.c.send({t:"end",s:p.score,r:i+1,n:r.length,top}));
  $("#host").innerHTML=`<h1>Final results</h1>${podium(top)}${board(8,3)}<p><button class="g" onclick="endHost()">Done</button></p>`;
}
function endHost(){clearInterval(tk);H&&clearTimeout(H.at);peer&&peer.destroy();peer=0;home()}

/* ---------- player ---------- */
function join(){
  const code=$("#code").value.trim(),name=$("#nick").value.trim(),j=$("#jmsg");
  if(!code||!name){j.textContent="Enter a game code and a nickname.";return}
  j.textContent="Connecting…";over=0;emoOn=0;
  peer&&peer.destroy();
  peer=new Peer();
  peer.on("error",e=>j.textContent=e.type=="peer-unavailable"?"No game found with that code.":"Connection error ("+e.type+").");
  peer.on("open",()=>{
    pc=peer.connect("kqz-"+code);
    pc.on("open",()=>pc.send({t:"join",name,e:em}));
    pc.on("data",pmsg);
    pc.on("close",()=>{music(0);if(!over)pscr('<h2>Host disconnected</h2><button onclick="leave()">Home</button>')});
    setTimeout(()=>{if(!pc.open&&!$("#join").hidden)j.textContent="Could not connect. Check the code and your network."},12000);
  });
}
function pmsg(m){
  if(m.t=="no"){leave();show("join");$("#jmsg").textContent=m.why}
  else if(m.t=="cfg"){emoOn=m.emo;const q=m.po?0:1;if(q!=qt){qt=q;music(1)}}
  else if(m.t=="mus"){mst=m.v;music(mw)}
  else if(m.t=="in"){qt=m.po?0:1;if(m.mus)mst=m.mus;sfx("join");music(1);pscr(`<div style="font-size:5rem;animation:bounce .6s">${em}</div><h2>You’re in, ${esc(m.name)}!</h2><p>Watch the host screen…</p>`)}
  else if(m.t=="q"){
    pick=[];multi=m.multi;sfx("pop");
    pscr(`<div class="bar"><i style="animation-duration:${m.time}s"></i></div><p>Question ${m.i+1} of ${m.n}</p><h1 id="tm">${m.time}</h1><h3>${esc(m.q)}</h3>
    ${m.img?`<img src="${esc(m.img)}" alt="" style="max-width:100%;max-height:30vh;border-radius:14px">`:""}

function qr(text){

  apos=v=>{if(v<2)return[];const n=Math.floor(v/7)+2,st=Math.ceil((v*4+4)/(n*2-2))*2,r=[6];for(let p=v*4+10;r.length<n;p-=st)r.splice(1,0,p);return r},

  let L,v;
  for(L of["M","L"]){for(v=1;v<=10;v++)if(4+(v<10?8:16)+D.length*8<=(raw(v)-QE[L][v-1]*QB[L][v-1])*8)break;if(v<=10)break}
  if(v>10)return null;
  const bits=[],put=(x,n)=>{for(let i=n-1;i>=0;i--)bits.push((x>>>i)&1)},cw=raw(v),ec=QE[L][v-1],nb=QB[L][v-1],dc=cw-ec*nb;
  put(4,4);put(D.length,v<10?8:16);D.forEach(b=>put(b,8));put(0,Math.min(4,dc*8-bits.length));while(bits.length%8)bits.push(0);
  const data=[];for(let i=0;i<bits.length;i+=8)data.push(parseInt(bits.slice(i,i+8).join(""),2));

  gen=n=>{const r=Array(n).fill(0);r[n-1]=1;let t=1;for(let i=0;i<n;i++){for(let j=0;j<n;j++){r[j]=mul(r[j],t);if(j+1<n)r[j]^=r[j+1]}t=mul(t,2)}return r},

  ns=nb-cw%nb,sl=Math.floor(cw/nb),g=gen(ec),bl=[];

  for(let i=0;i<nb;i++){const d=data.slice(k,k+sl-ec+(i<ns?0:1));k+=d.length;bl.push({d,e:rem(d,g)})}
  const seq=[];for(let i=0;i<=sl-ec;i++)bl.forEach(b=>i<b.d.length&&seq.push(b.d[i]));for(let i=0;i<ec;i++)bl.forEach(b=>seq.push(b.e[i]));

  sf=(x,y,d)=>{M[y][x]=+d;F[y][x]=1},bit=(x,i)=>(x>>>i)&1;

  fp(3,3);fp(N-4,3);fp(3,N-4);
  const ps=apos(v);

  mask=m=>{for(let y=0;y<N;y++)for(let x=0;x<N;x++)if(!F[y][x]&&mf(m,x,y))M[y][x]^=1},

}
