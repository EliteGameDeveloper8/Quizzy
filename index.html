<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Quizzy</title>
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
:root{--ink:#0b2530;--a:#ff6f59;--b:#ffc93c;--c:#7bdff2;--d:#b79cff}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;min-height:100vh;font-family:"Avenir Next Rounded","Nunito","Trebuchet MS",system-ui,sans-serif;background:linear-gradient(160deg,#06303a,#0c1c3d) fixed;color:#effcff}
main{max-width:900px;margin:0 auto;padding:16px}
h1,h2,h3,p{margin:.4em 0}
h1.logo{font-size:2.8rem;letter-spacing:-.04em;margin:.1em 0}
.card{background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.16);border-radius:16px;padding:12px;margin:10px 0}
button{font:inherit;font-weight:800;border:0;border-radius:12px;padding:10px 16px;cursor:pointer;background:var(--c);color:var(--ink);box-shadow:0 4px 0 rgba(0,0,0,.28);transition:transform .08s}
button:active{transform:translateY(3px);box-shadow:none}
button.g{background:var(--b)}button.r{background:var(--a)}
button.o{background:transparent;color:#effcff;box-shadow:inset 0 0 0 2px rgba(255,255,255,.35)}
button.s{padding:6px 10px;font-size:.85rem}
button:disabled{opacity:.4;cursor:default}
:focus-visible{outline:3px solid var(--b);outline-offset:2px}
input,select{font:inherit;padding:9px;border:0;border-radius:10px;width:100%;min-width:0;background:#fff;color:var(--ink)}
input[type=file]{width:auto;background:none;color:inherit;padding:0}
input[type=checkbox]{width:26px;height:26px;accent-color:var(--ink);flex:none}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row>input:not([type]){flex:1;min-width:120px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.c0{background:var(--a)}.c1{background:var(--b)}.c2{background:var(--c)}.c3{background:var(--d)}
.opt{min-height:84px;font-size:1.2rem;font-weight:800;border-radius:20px;color:var(--ink);display:flex;align-items:center;gap:12px;padding:12px;text-align:left;box-shadow:0 6px 0 rgba(0,0,0,.28);animation:pop .4s backwards}
.opt .l{display:grid;place-items:center;width:38px;height:38px;border-radius:50%;background:var(--ink);color:#fff;flex:none}
.opt.sel{outline:5px solid #fff;transform:scale(.96)}
.at{display:flex;align-items:center;gap:8px;padding:8px;border-radius:14px;color:var(--ink)}
.bar{height:10px;background:rgba(255,255,255,.15);border-radius:9px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--b);transform-origin:left;animation:drain linear forwards}
#tm{font-size:2.6rem;margin:0;min-width:2ch}
#tm.hot{color:var(--a);animation:beat .5s infinite alternate}
.badge{display:inline-block;background:var(--d);color:var(--ink);font-weight:800;border-radius:20px;padding:4px 14px}
.code{font-size:min(18vw,7rem);font-weight:900;letter-spacing:.08em;color:var(--b)}
.chip{display:inline-block;background:var(--c);color:var(--ink);border-radius:20px;padding:6px 14px;margin:4px;font-weight:800;animation:pop .3s}
.mid{text-align:center}
.good{color:#9dffb0}.bad{color:#ffa391}
#play{padding-top:4vh}
#mute{position:fixed;top:8px;right:8px;z-index:9;padding:6px 10px}
#host>*,#play>*{animation:rise .35s backwards}
@keyframes pop{from{transform:scale(.6);opacity:0}}
@keyframes rise{from{transform:translateY(14px);opacity:0}}
@keyframes drain{to{transform:scaleX(0)}}
@keyframes beat{to{transform:scale(1.25)}}
@keyframes bounce{0%{transform:scale(0)}60%{transform:scale(1.3)}}
@keyframes shake{25%{transform:translateX(-12px)}75%{transform:translateX(12px)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.c4{background:#8be0a4}.c5{background:#ff9ecb}.c6{background:#ffa94d}.c7{background:#cfd8e6}
input[type=number]{width:76px}
#mute,#mm{position:fixed;top:8px;z-index:9;padding:6px 10px}#mute{right:8px}#mm{right:62px}
.em{font-size:1.5rem;padding:4px 8px;background:transparent;box-shadow:none}.em.on{outline:3px solid var(--b)}
.pod{display:flex;justify-content:center;align-items:flex-end;gap:10px;margin:16px 0}
.pc{display:flex;flex-direction:column;align-items:center;flex:1;max-width:160px}
.pb{width:100%;border-radius:12px 12px 0 0;display:grid;place-items:center;font-size:2rem;font-weight:900;color:var(--ink);transform-origin:bottom}
@keyframes grow{from{transform:scaleY(0)}}
main{padding:52px 16px 76px}
#lg{position:fixed;top:8px;right:8px;z-index:9;padding:6px 10px}#mute{right:62px}#mm{right:116px}
#emo{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;gap:6px;padding:8px;background:rgba(6,20,40,.88);z-index:8}
#emo button{font-size:1.7rem}
.fl{position:fixed;bottom:70px;z-index:20;font-size:2.6rem;pointer-events:none;text-align:center;animation:fly 2.5s ease-out forwards}
.fl small{display:block;font-size:.8rem;font-weight:800}
@keyframes fly{to{transform:translateY(-60vh);opacity:0}}
.qrb{display:flex;flex-direction:column;align-items:center;gap:4px;cursor:zoom-in}
.qrb svg{width:168px;height:168px;border-radius:12px;display:block}
.qrb .qc{display:none;font-size:2.4rem;font-weight:900;color:var(--b)}
.qrb.big{position:fixed;inset:0;z-index:30;justify-content:center;background:rgba(6,20,40,.96);cursor:zoom-out}
.qrb.big svg{width:min(88vw,70vh);height:min(88vw,70vh)}
.qrb.big .qc{display:block}
#lg svg{display:block;height:16px;width:auto;border-radius:2px}
</style>
</head>
<body>
<button id="mm" class="o s" onclick="togMm()" title="Music on/off" aria-label="Music on/off"></button>
<button id="mute" class="o s" onclick="mute=!mute;LS.setItem('qz_mute',mute?1:0);this.textContent=mute?'🔇':'🔊'" title="Sound effects on/off" aria-label="Sound effects on/off"></button>
<button id="lg" class="o s" onclick="togLang()" title="Language" aria-label="Language"></button>
<div id="emo" hidden></div>
<main>
<section id="menu" class="mid">
  <h1 class="logo">Quizzy</h1>
  <p>Play quizzes with friends, hosted from your own device</p>
  <div class="grid" style="max-width:560px;margin:28px auto">
    <button class="opt c1" style="justify-content:center;min-height:120px" onclick="show('join')"><span style="font-size:2rem">🎮</span><span>Join a game</span></button>
    <button class="opt c2" style="justify-content:center;min-height:120px" onclick="home()"><span style="font-size:2rem">✏️</span><span>Create quiz</span></button>
  </div>
</section>

<section id="join" hidden>
  <button class="o" onclick="menu()">← Back</button>
  <div class="card" id="jcard">
    <h2>Join a game</h2>
    <div class="row"><input id="code" placeholder="Game code" inputmode="numeric"><input id="nick" placeholder="Nickname" maxlength="16"></div>
    <p><small>Pick your character</small></p>
    <div id="ems" class="row" style="margin-bottom:8px"></div>
    <button class="g" onclick="join()">Join</button> <small id="jmsg"></small>
  </div>
  <div id="ended" class="card mid" hidden><div style="font-size:3.5rem">🚪</div><h2 id="emsg"></h2><button class="g" onclick="menu()">Back to menu</button></div>
</section>

<section id="quizzes" hidden>
  <div class="row">
    <button class="o" onclick="menu()">← Back</button>
    <h2 style="flex:1">My quizzes</h2>
    <input id="find" placeholder="Search…" oninput="home()" style="width:140px;flex:none">
    <button class="g" onclick="edit()">+ New quiz</button>
    <button onclick="$('#imp').click()">Import</button>
    <input id="imp" type="file" accept=".json,application/json" hidden onchange="imp(this.files[0]);this.value=''">
  </div>
  <div id="lib"></div>
</section>

<section id="edit" hidden>
  <div class="row">
    <input id="t" placeholder="Quiz title" oninput="cur.title=this.value">
    <button class="g" onclick="saveQ()">Save</button>
    <button class="o" onclick="home()">Cancel</button>
  </div>
  <p><small>Tick every correct answer. With 2 or more ticked, choose whether any one of them is right or all must be selected. Press Ctrl+V to paste an image into the selected question.</small></p>
  <div id="qs"></div>
  <button onclick="addQ()">+ Add question</button>
</section>

<section id="host" class="mid" hidden></section>
<section id="play" class="mid" hidden></section>
</main>

<script>
const LS=(()=>{try{const t=window.localStorage;t.getItem("q");return t}catch(e){const m={};return{getItem:k=>k in m?m[k]:null,setItem:(k,v)=>{m[k]=String(v)},removeItem:k=>{delete m[k]}}}})();
const $=s=>document.querySelector(s),
esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"})[c]),
LT="ABCDEFGH",KEY="quizzy_games",
load=()=>{try{const g=JSON.parse(LS.getItem(KEY))||[];g.forEach(x=>x.qs.forEach(q=>{if(!Array.isArray(q.ok))q.ok=[q.ok|0];q.mode=q.mode||(q.ok.length>1?"all":"any")}));return g}catch(e){return[]}},
save=g=>{try{LS.setItem(KEY,JSON.stringify(g));return 1}catch(e){alert("Browser storage is full. Use fewer or smaller images.")}},
show=v=>{["menu","join","quizzes","edit","host","play"].forEach(x=>$("#"+x).hidden=x!=v);$("#emo").hidden=1},
blank=()=>({q:"",img:"",type:"choice",a:["","","",""],ok:[0],txt:"",tol:1,cs:0,mode:"any",time:20}),
live=()=>Object.values(players).filter(p=>p.c.open),
bc=m=>live().forEach(p=>p.c.send(m)),
rank=()=>Object.values(players).sort((a,b)=>b.score-a.score),
board=(n,f=0)=>rows(lb(n),f)||"<p>No players</p>",
pscr=h=>{show("play");$("#play").innerHTML=h;$("#emo").hidden=!(emoOn&&!over&&pc&&pc.open)};
let cur,peer,H,pc,over,fq,tk,pick=[],multi,AC,players={},mute=LS.getItem("qz_mute")=="1";
$("#mute").textContent=mute?"🔇":"🔊";
const EM=["🐱","🐶","🦊","🐼","🐸","🦄","🐙","🐵","🦁","🐯","🐧","🐳","🐲","🤖","👻","🚀"],
norm=(s,cs)=>{s=String(s).trim().replace(/\s+/g," ");return cs?s:s.toLowerCase()},
acc=q=>(q.txt||"").split(",").map(x=>norm(x,q.cs)).filter(Boolean),
lev=(a,b)=>{let p=[...Array(b.length+1).keys()];for(let i=1;i<=a.length;i++){const c=[i];for(let j=1;j<=b.length;j++)c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]==b[j-1]?0:1));p=c}return p[b.length]};
let mm=LS.getItem("qz_mm")=="1",em=LS.getItem("qz_em")||EM[0],mw=0,mi,bt=0;
let mst=LS.getItem("qz_mus")||"upbeat",X,NB;
const mmUi=()=>{$("#mm").textContent=mm?"🎵 ✕":"🎵"},
togMm=()=>{mm=!mm;LS.setItem("qz_mm",mm?1:0);mmUi();music(mw)},
hz=n=>440*2**((n-69)/12),rnd=n=>Math.floor(Math.random()*n),pk=a=>a[rnd(a.length)],
CT={M:[0,4,7],m:[0,3,7],M7:[0,4,7,11],m7:[0,3,7,10],"7":[0,4,7,10]},ARR=[1,2,3,3,2,3,3,1],
MO=[["upbeat","Upbeat"],["chill","Chill"],["arcade","Arcade"],["off","No music"]],
musSel=()=>`<select style="width:auto" title="Music" onchange="setMus(this.value)">${MO.map(([v,l])=>`<option value="${v}" ${v==mst?"selected":""}>${l}</option>`).join("")}</select>`,
MS={
upbeat:{bpm:122,rt:48,lo:24,sc:[0,2,4,7,9],sw:0,wet:.18,ln:[1,1,1,2,2,3,4],rp:.2,cm:"stab",lt:"triangle",bt:"triangle",bv:.5,cv:.14,ev:.45,
 pr:[[[0,"M"],[7,"M"],[9,"m"],[5,"M"]],[[0,"M"],[9,"m"],[5,"M"],[7,"M"]],[[5,"M"],[7,"M"],[4,"m"],[9,"m"]],[[0,"M"],[5,"M"],[7,"M"],[5,"M"]]],
 k:["x...x...x...x...","x...x...x..xx..."],s:["....x.......x..."],h:["..x...x...x...x.","x.x.x.x.x.x.x.x."],
 b:["r.......r...f...","r..r..r.r..r..f.","r.r.r.r.r.r.r.r."],c:["..x...x...x...x.","x.....x...x....."]},
chill:{bpm:80,rt:48,lo:12,sc:[0,2,4,7,9],sw:.5,wet:.35,ln:[2,2,3,4,4,6],rp:.4,cm:"ep",lt:"sine",bt:"sine",bv:.55,cv:.13,ev:.4,
 pr:[[[0,"M7"],[9,"m7"],[2,"m7"],[7,"7"]],[[5,"M7"],[4,"m7"],[2,"m7"],[0,"M7"]],[[9,"m7"],[2,"m7"],[7,"7"],[0,"M7"]],[[0,"M7"],[5,"M7"],[4,"m7"],[9,"m7"]]],
 k:["x.....x...x.....","x.......x.x....."],s:["....x.......x..."],h:["x.x.x.x.x.x.x.x.","..x...x...x...x."],
 b:["r.......r.....f.","r.....r.r......."],c:["x.....x...x.....","x.......x.....x."]},
arcade:{bpm:140,rt:45,lo:24,sc:[0,3,5,7,10],sw:0,wet:.12,ln:[1,1,1,1,2,2,3],rp:.1,cm:"arp",lt:"square",bt:"square",bv:.28,cv:.09,ev:.2,
 pr:[[[0,"m"],[8,"M"],[3,"M"],[10,"M"]],[[0,"m"],[10,"M"],[8,"M"],[10,"M"]],[[5,"m"],[0,"m"],[8,"M"],[7,"m"]],[[0,"m"],[7,"m"],[8,"M"],[10,"M"]]],
 k:["x...x...x...x...","x..xx...x..xx..."],s:["....x.......x...","....x...x...x..x"],h:["x.x.x.x.x.x.x.x.","xxxxxxxxxxxxxxxx"],
 b:["r.r.r.r.r.r.r.r.","r.rrr.r.r.rrr.r.","r.o.r.o.r.o.r.o."],c:["xxxxxxxxxxxxxxxx"]}};
mmUi();
function vo(o,t,f,d,v,ty,lp){
  const s=AC.createOscillator(),g=AC.createGain();s.type=ty;s.frequency.value=f;
  g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(v,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+d);
  if(lp){const q=AC.createBiquadFilter();q.type="lowpass";q.frequency.value=lp;s.connect(q);q.connect(g)}else s.connect(g);
  g.connect(o);s.start(t);s.stop(t+d+.05);
}
function dr(o,k,t,v){
  if(k=="k"){const s=AC.createOscillator(),g=AC.createGain();s.frequency.setValueAtTime(150,t);s.frequency.exponentialRampToValueAtTime(45,t+.12);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+.22);s.connect(g);g.connect(o);s.start(t);s.stop(t+.25);return}
  if(!NB||NB.sampleRate!=AC.sampleRate){NB=AC.createBuffer(1,AC.sampleRate,AC.sampleRate);NB.getChannelData(0).forEach((_,i,a)=>a[i]=Math.random()*2-1)}
  const s=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain(),h=k=="h";
  s.buffer=NB;f.type=h?"highpass":"bandpass";f.frequency.value=h?7500:1800;
  g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+(h?.04:.16));
  s.connect(f);f.connect(g);g.connect(o);s.start(t);s.stop(t+.2);
}
/* random 2-bar melody on a pentatonic scale; slots are eighth notes */
function mel(S,end){
  const n=Array(16).fill(0);let i=3+rnd(3),s=0;
  while(s<16){const l=Math.min(pk(S.ln),16-s);if(s%4==0||Math.random()>S.rp)n[s]={i,l};s+=l;i=Math.max(0,Math.min(9,i+pk([-2,-1,-1,0,1,1,2])))}
  let q=16;while(!n[--q]);
  n[q].i=end?(n[q].i>=3?5:0):pk([2,3,7,8]);
  return n;
}
const mut=a=>{a=a.map(x=>x&&{...x});for(let k=0;k<3;k++){const x=a[rnd(16)];if(x)x.i=Math.max(0,Math.min(9,x.i+pk([-2,-1,1,2])))}return a};
/* one 16th-note step. Every 4 bars: new chord progression and drum/bass patterns; every 8 sections: new melody; layers come and go (ARR) */
function mstep(){
  const S=X.S,s=X.st%16,sp=60/S.bpm/4,t=X.t+(s%4==2?S.sw*sp:0),o=X.bus;
  if(!s){
    const bi=X.B++%4;
    if(!bi){
      const c=X.sec++%8;
      if(!c){X.A=mel(S,0);X.Z=mel(S,1)}
      X.lv=ARR[c];X.mu=[c%2?mut(X.A):X.A,c%2?mut(X.Z):X.Z];
      let p;do p=pk(S.pr);while(p==X.pr&&S.pr.length>1);X.pr=p;
      X.k=pk(S.k);X.h=pk(S.h);X.bp=pk(S.b);X.cp=pk(S.c);X.sn=pk(S.s);
    }
    X.bi=bi;X.ch=X.pr[bi];
  }
  const [r0,ty]=X.ch,rt=r0>=6?r0-12:r0,iv=CT[ty],bi=X.bi,lv=X.lv,base=S.rt+12+rt;
  if(lv>=2){
    if(X.k[s]=="x")dr(o,"k",t,.9);
    if(X.sn[s]=="x")dr(o,"s",t,.4);
    if(X.h[s]=="x")dr(o,"h",t,s%4==2?.16:.1);
    if(bi==3&&s>=12&&S.cm!="ep")dr(o,"s",t,.12+.05*(s-12));
  }
  const bn=X.bp[s];
  if(bn!=".")vo(o,t,hz(S.rt+rt+(bn=="f"?7:bn=="o"?12:0)),sp*3,S.bv,S.bt);
  if(S.cm=="arp")vo(o,t,hz(base+12+iv[[0,1,2,1][s%4]%iv.length]),sp*1.6,S.cv,"square");
  else if(X.cp[s]=="x")iv.forEach(x=>S.cm=="ep"?(vo(o,t,hz(base+x),1.4,S.cv,"sine"),vo(o,t,hz(base+x+12),.5,S.cv*.3,"sine")):vo(o,t,hz(base+x),.2,S.cv,"sawtooth",1300));
  if(lv>=3&&s%2==0){
    const x=X.mu[bi>>1][(bi&1)*8+s/2];
    if(x){
      const pcs=iv.map(a=>(S.rt+rt+a)%12),md=j=>S.rt+S.lo+12*Math.floor(j/5)+S.sc[j%5];
      let i=x.i;
      if(s%8==0)i=[i,i+1,i-1].find(j=>j>=0&&j<10&&pcs.includes(md(j)%12))??i;
      vo(o,t,hz(md(i)),x.l*sp*2*.95,S.ev,S.lt);
    }
  }
  X.st++;X.t+=sp;
}
function mtick(){
  if(!X)return;
  if(AC.state=="suspended")AC.resume();
  if(X.t<AC.currentTime-.5)X.t=AC.currentTime+.05;
  while(X.t<AC.currentTime+.6)mstep();
}
function music(on){
  mw=on;clearInterval(mi);mi=0;
  if(X){const x=X;X=0;x.out.gain.cancelScheduledValues(0);x.out.gain.setTargetAtTime(0,AC.currentTime,.08);setTimeout(()=>x.out.disconnect(),700)}
  if(!on||mm||!MS[mst])return;
  try{
    AC=AC||new AudioContext();AC.resume();
    const S=MS[mst],out=AC.createGain(),bus=AC.createGain(),dl=AC.createDelay(1),fb=AC.createGain(),wt=AC.createGain(),n=AC.currentTime;
    out.gain.setValueAtTime(0,n);out.gain.linearRampToValueAtTime(.2,n+.5);
    dl.delayTime.value=60/S.bpm*.75;fb.gain.value=.3;wt.gain.value=S.wet;
    bus.connect(out);bus.connect(dl);dl.connect(fb);fb.connect(dl);dl.connect(wt);wt.connect(out);out.connect(AC.destination);
    X={S,out,bus,t:n+.1,st:0,B:0,sec:2,pr:0,A:mel(S,0),Z:mel(S,1)};
    mi=setInterval(mtick,100);
  }catch(e){X=0}
}
function setMus(v){mst=v;H.cfg.mus=v;LS.setItem("qz_mus",v);bc({t:"mus",v});music(mw)}
function emUi(){$("#ems").innerHTML=EM.map(e=>`<button class="em ${e==em?"on":""}" onclick="em='${e}';LS.setItem('qz_em',em);emUi()">${e}</button>`).join("")}
emUi();
function rows(l,f=0){return l.slice(f).map((p,i)=>`<div class="card row" style="animation:rise .4s ${i*.1}s backwards"><b>${i+f+1}</b><span style="font-size:1.6rem">${p.e}</span><span style="flex:1;text-align:left">${esc(p.n)}</span><b>${p.s}</b></div>`).join("")}
function lb(n){return rank().slice(0,n).map(p=>({n:p.name,e:p.e,s:p.score}))}
function podium(l){return `<div class="pod">${[1,0,2].map(i=>l[i]?`<div class="pc"><div style="font-size:2.4rem">${l[i].e}</div><b>${esc(l[i].n)}</b><small>${l[i].s}</small><div class="pb c${[1,2,0][i]}" style="height:${[120,85,60][i]}px;animation:grow .8s ${.2+(2-i)*.4}s backwards">${i+1}</div></div>`:"").join("")}</div>`}

/* ---------- sound ---------- */
const NOTES={tick:[[880,.05]],click:[[600,.04]],pop:[[520,.06],[780,.08]],join:[[660,.08],[880,.12]],go:[[392,.1],[523,.1],[659,.1],[784,.25]],ok:[[523,.1],[659,.1],[784,.25]],no:[[260,.15],[196,.3]],end:[[523,.15],[659,.15],[784,.15],[1047,.4]]};
function sfx(k){
  if(mute)return;
  try{
    AC=AC||new AudioContext();AC.resume();
    let t=AC.currentTime;
    NOTES[k].forEach(([f,d])=>{
      const o=AC.createOscillator(),g=AC.createGain();
      o.type=k=="no"?"sawtooth":"triangle";o.frequency.value=f;
      g.gain.setValueAtTime(.15,t);g.gain.exponentialRampToValueAtTime(.001,t+d);
      o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d);t+=d*.9;
    });
  }catch(e){}
}
addEventListener("pointerdown",e=>{try{AC=AC||new AudioContext();AC.resume()}catch(x){}if(e.target.closest("button")&&e.target.id!="mute")sfx("click")});

/* shared countdown: updates #tm, ticks (host only), calls end at 0 */
function clock(t,end,snd){
  clearInterval(tk);
  const t0=Date.now();let last=t;
  tk=setInterval(()=>{
    const l=Math.max(0,Math.ceil(t-(Date.now()-t0)/1000)),e=$("#tm");
    if(e){e.textContent=l;e.classList.toggle("hot",l<=5)}
    if(l!=last){last=l;if(snd&&l<=5&&l>0)sfx("tick")}
    if(!l){clearInterval(tk);end&&end()}
  },200);
}

/* ---------- library ---------- */
function home(){
  show("quizzes");music(0);
  const f=$("#find").value.toLowerCase();
  $("#lib").innerHTML=load().filter(x=>x.title.toLowerCase().includes(f)).map(x=>
    `<div class="card row"><div style="flex:1"><b>${esc(x.title)}</b><br><small>${x.qs.length} questions</small></div>
    <button class="g" onclick="hostGame('${x.id}')">Host</button>
    <button class="s" onclick="edit('${x.id}')">Edit</button>
    <button class="s" onclick="share('${x.id}')">Share link</button>
    <button class="s" onclick="exp('${x.id}')">Export</button>
    <button class="r s" onclick="del('${x.id}')">Delete</button></div>`).join("")
    ||"<p>No quizzes found. Make one with “New quiz” or import one.</p>";
}
function del(id){if(confirm("Delete this quiz?")){save(load().filter(x=>x.id!=id));home()}}

/* ---------- export / import / share ---------- */
function exp(id){
  const g=load().find(x=>x.id==id),a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob([JSON.stringify({quizzy:1,...g})],{type:"application/json"}));
  a.download=(g.title.replace(/[^\w-]+/g,"_")||"quiz")+".quizzy.json";
  a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}
